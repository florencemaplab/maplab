name: Update publications from Scopus

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scopus-update
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update BibTeX from Scopus
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
        run: |
          python scripts/update_scopus_bibtex.py \
            --authors scripts/scopus_authors.json \
            --output data/publications.bib \
            --view STANDARD \
            --skip-abstract-retrieval

      - name: Update author Scopus analytics
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
        run: |
          python scripts/update_scopus_author_analytics.py \
            --authors scripts/scopus_authors.json \
            --people-index data/people/people.json \
            --people-dir data/people \
            --bibtex data/publications.bib \
            --output-dir data/scopus

      - name: Commit updated bibliography and analytics if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/publications.bib data/scopus

          if git diff --cached --quiet; then
            echo "No publication or analytics changes to commit."
          else
            git commit -m "Update publications and Scopus analytics"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
