name: Update publications from Scopus

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scopus-update
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update BibTeX from Scopus
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
        run: |
          python scripts/update_scopus_bibtex.py \
            --authors scripts/scopus_authors.json \
            --output data/publications.bib \
            --view STANDARD \
            --skip-abstract-retrieval

      - name: Update author Scopus analytics
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
        run: |
          python scripts/update_scopus_author_analytics.py \
            --authors scripts/scopus_authors.json \
            --people-index data/people/people.json \
            --people-dir data/people \
            --bibtex data/publications.bib \
            --output-dir data/scopus

      - name: Build static lab network
        run: |
          mkdir -p data/network
          python scripts/build_lab_network.py \
            --bibtex data/publications.bib \
            --people-index data/people/people.json \
            --people-dir data/people \
            --output data/network/lab-network.json

          echo "Generated network file:"
          ls -lah data/network
          echo "First bytes:"
          head -c 300 data/network/lab-network.json || true
          echo
          echo "Git status after network generation:"
          git status --short

      - name: Commit updated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/publications.bib
          git add data/scopus
          git add -f data/network/lab-network.json

          echo "Staged files:"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "No publication, analytics, or network changes to commit."
          else
            git commit -m "Update publications, analytics, and lab network"

            # main may have moved while this workflow was running.
            # These files are generated outputs, so if rebase conflicts on them,
            # keep the files produced by this workflow run and continue.
            git fetch origin main

            if ! git rebase -X theirs origin/main; then
              echo "::warning::Rebase conflict detected in generated files. Keeping workflow-generated outputs."

              git checkout --theirs data/publications.bib || true
              git checkout --theirs data/scopus || true
              git checkout --theirs data/network/lab-network.json || true

              git add data/publications.bib
              git add data/scopus
              git add -f data/network/lab-network.json

              GIT_EDITOR=true git rebase --continue
            fi

            git push origin HEAD:main
          fi
